name: Fetch Torvik Ratings

# Torvik blocks GitHub-hosted runners (403), so this runs on a self-hosted
# runner on a home computer: repo Settings → Actions → Runners. If that
# computer is off, the run waits in the queue (up to 24h) and goes when it
# comes back online.
on:
  schedule:
    - cron: '0 11,17 * * *'  # ~7am and 1pm ET — Torvik updates overnight
  workflow_dispatch:

jobs:
  fetch:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch Torvik and push to Gist (Windows)
        if: runner.os == 'Windows'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python .github/scripts/fetch_torvik.py

      - name: Fetch Torvik and push to Gist (Mac/Linux)
        if: runner.os != 'Windows'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 .github/scripts/fetch_torvik.py
