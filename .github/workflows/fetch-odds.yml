name: Fetch Odds
on:
  schedule:
    # Every 30 min from noon UTC (7am ET) through midnight UTC (7pm ET) — covers all US game windows
    - cron: '*/30 12-23 * * *'
    - cron: '*/30 0-6 * * *'
  workflow_dispatch:
    inputs:
      tomorrow:
        description: "Also refresh tomorrow's NCAAB lines now"
        type: boolean
        default: false

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch NCAAB odds (BettingPros) and push to Gist
        env:
          ODDS_PROVIDER_KEY: ${{ secrets.ODDS_PROVIDER_KEY }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        # Today every run; tomorrow (so the site can show lines a day ahead) only
        # in the first run of ~9am, 1pm, 5pm and 9pm ET — the BettingPros plan
        # allows 1,000 calls a day and a full slate costs ~9.
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d) python3 .github/scripts/fetch_bettingpros_odds.py
          H=$(TZ=America/New_York date +%H); M=$(date +%M)
          if [ "${{ inputs.tomorrow }}" = "true" ] || { [[ " 09 13 17 21 " == *" $H "* ]] && [ "$M" -lt 30 ]; }; then
            DATE=$(TZ=America/New_York date -d '+1 day' +%Y-%m-%d) python3 .github/scripts/fetch_bettingpros_odds.py
          fi

      - name: Fetch MLB moneylines and push to Gist
        if: false  # MLB off-season; uses the retired Odds API key. Needs a BettingPros port to resume.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DATE=$DATE python3 .github/scripts/fetch_mlb_odds.py

      - name: Fetch NFL odds and push to Gist
        if: false  # NFL/CFB paused — not in use; delete this line to resume
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: python3 .github/scripts/fetch_nfl_odds.py

      - name: Fetch CFB odds and push to Gist
        if: false  # NFL/CFB paused — not in use; delete this line to resume
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: python3 .github/scripts/fetch_cfb_odds.py

      - name: Fetch CFB power ratings (FPI)
        if: false  # NFL/CFB paused — not in use; delete this line to resume
        continue-on-error: true
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: python3 .github/scripts/fetch_cfb_fpi.py

      # Must run after both the CFB odds and FPI steps — it reads what they wrote.
      - name: Log CFB model predictions
        if: false  # NFL/CFB paused — not in use; delete this line to resume
        continue-on-error: true
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: python3 .github/scripts/log_cfb_predictions.py

      - name: Fetch MLB alternate spreads (once per day)
        if: false  # MLB off-season; uses the retired Odds API key. Needs a BettingPros port to resume.
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DATE=$DATE python3 .github/scripts/fetch_alt_odds.py

      - name: Lock commenced games
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: python3 .github/scripts/lock_games.py

      - name: Log MLB model predictions
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DATE=$DATE python3 .github/scripts/log_mlb_predictions.py

      # Walks back 10 days, not just yesterday, so any gap in results (an API
      # outage, a failed run) heals itself instead of staying unscored forever.
      # Days that are already complete cost one Gist read and no write.
      - name: Fill MLB results (recent days)
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
          BACKFILL_DAYS: '10'
        run: |
          YESTERDAY=$(date -u -d '-1 day' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          DATE=$YESTERDAY python3 .github/scripts/fill_mlb_results.py

      - name: Fill MLB results (today)
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DATE=$DATE python3 .github/scripts/fill_mlb_results.py

      # Re-logs each NCAAB game every run until tip-off, then freezes it — the
      # frozen pick is what the site's takes/leans record grades.
      - name: Log NCAAB model predictions
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # push alerts for new/upgraded picks (ntfy.sh)
          TZ: America/New_York
        run: node .github/scripts/log_ncaab_predictions.js

      - name: Fill NCAAB results (recent days)
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.ODDS_GIST_ID }}
          BACKFILL_DAYS: '3'
        run: |
          DATE=$(TZ=America/New_York date +%Y-%m-%d)
          DATE=$DATE python3 .github/scripts/fill_ncaab_results.py
