name: Verify CFBD secret (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CFBD_API_KEY works
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "CFBD_API_KEY secret is not set in this repo."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CFBD_API_KEY" \
            "https://api.collegefootballdata.com/ratings/sp?year=2025&team=Ohio%20State")
          echo "HTTP status: $code"
          if [ "$code" = "200" ]; then
            echo "Key works. Sample response:"
            cat /tmp/resp.json
          else
            echo "Key did not authenticate (see status above)."
            exit 1
          fi
